name: Build Tecno AI APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # Permanent signing key from the TECNOAI_KEYSTORE_BASE64 secret, so every APK
      # can be installed as an update over the previous one.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.TECNOAI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p signing
            echo "$KEYSTORE_B64" | base64 -d > signing/tecnoai-release.jks
            echo "Using the permanent Tecno AI signing key."
          else
            echo "::warning::TECNOAI_KEYSTORE_BASE64 secret is not set. This APK uses a temporary key and can't update an installed copy."
          fi

      - name: Build APK
        env:
          TECNOAI_KEYSTORE_PASSWORD: ${{ secrets.TECNOAI_KEYSTORE_PASSWORD }}
          TECNOAI_KEY_PASSWORD: ${{ secrets.TECNOAI_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          OUT="TecnoAI-v${VERSION}.apk"
          cp "$APK" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: TecnoAI-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      # One always-current download on the main branch instead of a new release per push
      - name: Publish "Latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "${{ steps.apk.outputs.file }}" \
            --target "${{ github.sha }}" \
            --title "Tecno AI v${{ steps.apk.outputs.version }} (latest build)" \
            --notes "Download **${{ steps.apk.outputs.file }}** below and open it on your Android phone to install.

          Built automatically from commit ${{ github.sha }}." \
            --latest
